<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset Password | FamPaw Care"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>.reset-card{max-width:480px;margin:8vh auto;background:#fff;padding:32px;border-radius:22px;box-shadow:0 10px 35px #58364f18;color:#58364f}.reset-card label{display:block;font-weight:700;margin:14px 0 6px}.reset-card input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font:inherit}.reset-card button{margin-top:18px;padding:13px 22px;background:#58364f;color:white;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}.reset-card p{line-height:1.6}.reset-msg{margin-top:14px;padding:12px;border-radius:10px;background:#e8eddf}.reset-msg.error{background:#f8f0f3}</style></head><body><main class="reset-card"><p><a href="login.html">← Back to Login</a></p><h1>Reset Password</h1><p>Enter the email address for your account and choose a new password. <strong>This demo updates the password only in this browser; it does not send an email.</strong></p><form id="resetForm"><label for="email">Email Address</label><input id="email" type="email" required autocomplete="email"><label for="password">New Password</label><input id="password" type="password" required minlength="8"><label for="confirm">Confirm New Password</label><input id="confirm" type="password" required minlength="8"><button type="submit">Update Password</button></form><p id="msg" role="status"></p></main><script src="js/store.js"></script><script>document.getElementById('resetForm').addEventListener('submit',function(e){e.preventDefault();const email=document.getElementById('email').value.trim();const pw=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;const msg=document.getElementById('msg');msg.className='reset-msg';if(pw.length<8){msg.textContent='Use at least 8 characters for the password.';msg.classList.add('error');return;}if(pw!==confirm){msg.textContent='The passwords do not match.';msg.classList.add('error');return;}const result=FP.resetPasswordForEmail(email,pw);msg.textContent=result.ok?'Password updated in this browser. You can now log in.':result.error;if(!result.ok)msg.classList.add('error');else document.getElementById('resetForm').reset();});</script></body></html>
