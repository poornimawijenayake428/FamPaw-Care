<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamPaw Care – Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>

<body>
<main class="login-card">

  <!-- ============ LEFT: PICTURE ============ -->
  <section class="art" aria-hidden="true">
    <div class="plane p1"></div>
    <div class="plane p2"></div>
    <div class="plane p3"></div>
    <div class="plane p4"></div>
    <div class="art-text">One Family, One Place, Better Care.<small>Everyone you love, all in one place.</small></div>
    <!-- To use a different picture: replace the src="..." with your file name, e.g. src="images/my-photo.png" -->
    <img class="art-img" alt="" src="images/family.webp">
  </section>

  <!-- ============ RIGHT: FORM ============ -->
  <section class="form-side">

    <div class="logo">
        <img src="images/logo.svg" alt="" width="32" height="32">
      </div>

    <h1>Hey, Hello</h1>
    <p class="sub">Please enter your details</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Email" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" autocomplete="current-password">
          <button type="button" class="eye" id="togglePw" data-target="password" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C6.5 5 2.7 9 1 12c1.700 3 5.500 7 11 7s9.300-4 11-7c-1.700-3-5.500-7-11-7Zm0 11.500A4.500 4.500 0 1 1 12 7.500a4.500 4.500 0 0 1 0 9Zm0-7a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5Z"/></svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label><input type="checkbox" id="rememberMe"> Remember Me</label>
        <a href="forgot-password.html">Forgot Password</a>
      </div>

      <button type="submit" class="btn btn-login">Login</button>
      <p class="msg" id="msg" role="status"></p>
    </form>

    <div class="or">or</div>

    <button type="button" class="btn btn-social">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.500c3.500 0 6.600 1.200 9.100 3.600l6.800-6.800C35.800 2.400 30.300 0 24 0 14.600 0 6.500 5.400 2.600 13.200l7.900 6.100C12.400 13.600 17.700 9.500 24 9.500Z"/><path fill="#4285F4" d="M46.500 24.500c0-1.600-.1-3.100-.4-4.500H24v9h12.700c-.6 3-2.200 5.500-4.700 7.200l7.600 5.900c4.400-4.100 6.900-10.100 6.900-17.600Z"/><path fill="#FBBC05" d="M10.500 28.700A14.500 14.500 0 0 1 9.500 24c0-1.600.3-3.200.8-4.700l-7.900-6.100A24 24 0 0 0 0 24c0 3.900.9 7.500 2.600 10.800l7.900-6.100Z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48Z"/></svg>
      Sign in with Google
    </button>
    <button type="button" class="btn btn-social">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.400 12.700c0-2.400 2-3.500 2.100-3.600-1.100-1.700-2.900-1.900-3.500-1.900-1.500-.2-2.900.9-3.700.9s-1.900-.9-3.200-.8c-1.600 0-3.100 1-4 2.400-1.700 3-.4 7.400 1.200 9.800.8 1.200 1.800 2.500 3 2.400 1.200 0 1.700-.8 3.100-.8s1.900.8 3.200.8 2.100-1.200 2.900-2.400c.9-1.400 1.300-2.700 1.300-2.800 0 0-2.400-1-2.400-4ZM14 5.600c.7-.8 1.100-1.900 1-3-1 0-2.100.7-2.800 1.500-.6.700-1.200 1.800-1 2.900 1.100.1 2.200-.6 2.800-1.400Z"/></svg>
      Sign in with Apple
    </button>

    <p class="signup">New to FamPaw Care? <a href="register.html">Create Account</a></p>
  </section>

</main>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
